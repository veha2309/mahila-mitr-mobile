name: platform_glass_navigation
description: Theme-aware native iOS Liquid Glass tabs and interactive Android glass navigation.
version: 0.2.0
publish_to: none
environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'
dependencies:
  liquid_retina_navigation:
    git:
      url: https://github.com/veha2309/liquid_retina_navigation.git
      ref: v0.1.0
  flutter:
    sdk: flutter
dev_dependencies:
  liquid_glass_easy: ^3.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PlatformGlassNavigationPlugin
